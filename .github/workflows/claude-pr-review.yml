name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ninja')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@ninja')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Customize the trigger phrase (default: @claude)
          trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          claude_args: |
            --append-system-prompt 
             Review this pull request. This is a Python project using FastAPI, LiteLLM, LangChain, LangSmith, New Relic, MongoDB, Kafka, and Google Cloud Platform.

            # Code Review Rules

            ## Code Quality & Python Standards
            - Python 3.10.11
            - PEP 8 – Style Guide for Python Code
            - PEP 484 - Type Hints (exception: local variables)
            - PEP 20 - The Zen of Python
            - SOLID principles applied
            - No magic numbers
            - DRY, YAGNI, KISS principles applied
            - Clear, descriptive variable names (no shortenings unless commonly used)
            - Consistent code formatting (autopep8)
            - No code duplication
            - Proper error handling and logging
            - No redundant comments (Clean Code book)
            - Comments explain "why", not "what" and exist only if can not be avoided with clean code structure
            - Single responsibility per class/method
            - No library deprecation warnings

            ## Security
            - No hardcoded secrets or passwords, exposed .env files (except sample)
            - Input validation implemented
            - SQL injection prevention
            - XSS prevention measures
            - Authentication/authorization checks
            - Secure error handling (no sensitive info in errors)

            ## Naming Conventions
            - `snake_case` for internal field names
            - `camelCase` for external API serialization
            - `kebab-case` for New Relic metrics (`{service-name}.{metric-name}`)
            - `CapWords` for class names

            ## Data Models
            - Use Pydantic BaseModels
            - Use Enums for fields with fixed values (not strings)
            - Field names concise - no redundant context (e.g., `id` not `user_id` inside User)
            - Multiple alternative sets of fields should be implemented as Algebraic Datatypes (ADTs), not through optional fields

            ### ADT Example

            ✅ Correct:
            ```python
            class Object(BaseModel):
                pass 

            class Human(Object):
                type: Literal["human"] = "human"
                age: int

            class House(Object):
                type: Literal["house"] = "house"
                material: str
            ```

            ❌ Incorrect:
            ```python
            class Object(BaseModel):
                type: Literal["human", "house"]
                age: Optional[int] = None
                material: Optional[str] = None
            ```

            ## Performance
            - No N+1 queries
            - Efficient algorithms used
            - Database queries optimized
            - Memory usage reasonable
            - No obvious performance bottlenecks

            ## Architecture
            - Follows established patterns
            - Proper separation of concerns
            - Dependencies injected properly
            - No tight coupling
            - Consistent with codebase style
            - Immutable classes when possible
            - Pure functions without side effects when possible

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }